[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "video-processor"
version = "0.1.0"
description = "Локальная расшифровка YouTube-видео."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "yt-dlp[default]>=2026.10.21,<2027",
  "faster-whisper>=1.2.1,<2",
  # faster-whisper 1.2.1 передаёт metadata_errors, удалённый в PyAV 19.
  "av>=11,<19",
]

[project.scripts]
vidoc = "video_processor.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3.5,<10",
  "ruff>=0.11.2,<1",
]
test = [
  "pytest>=8.3.5,<10",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
